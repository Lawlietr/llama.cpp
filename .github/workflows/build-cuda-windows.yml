name: fork-windows-cuda

# fork build config (manual dispatch + auto on master push, i.e. after upstream sync).
# edit this file to change the build.
on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: fork-win-cuda
  queue: max

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  cuda:
    name: windows-cuda (${{ matrix.cuda }}, ${{ matrix.arch }})
    runs-on: windows-2022

    permissions:
      actions: write
      contents: write

    strategy:
      matrix:
        include:
          - cuda: '12.4'
            arch: x64
            defines: '-DGGML_CUDA_CUB_3DOT2=ON'

    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: fork-windows-2022-${{ matrix.arch }}-cuda-${{ matrix.cuda }}

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}
          cuda_arch: ${{ matrix.arch }}

      - name: Install Ninja
        id: install_ninja
        run: |
          choco install ninja

      - name: Build
        id: cmake_build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.arch == 'x64' && 'x64' || 'amd64_arm64' }}
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=ON ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DGGML_RPC=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ${{ matrix.defines }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target llama-cli llama-server llama-mtmd-cli llama-gguf-split ggml-rpc-server

      - name: Get short commit hash
        id: commit
        shell: cmd
        run: |
          for /f %%i in ('git rev-parse --short=8 HEAD') do echo SHORT=%%i >> %GITHUB_OUTPUT%

      - name: Pack artifacts
        id: pack_artifacts
        run: |
          7z a -snl llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip .\build\bin\Release\*.exe .\build\bin\Release\*.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          path: llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip
          name: llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}
          name: ${{ matrix.cuda }}-${{ matrix.arch }} (${{ steps.commit.outputs.SHORT }})
          fail_on_unprotected_branch: false
          files: llama-bin-win-cuda-${{ matrix.cuda }}-${{ matrix.arch }}.zip

      - name: ccache-clear
        uses: ./.github/actions/ccache-clear
        with:
          key: fork-windows-2022-${{ matrix.arch }}-cuda-${{ matrix.cuda }}
